name: "Zigbee2MQTT-MCP"
version: "1.1.1"
slug: "mcp2zigbee2mqtt"
description: "MCP Server that connects AI assistants to ZigBee2MQTT via MQTT for device discovery and control"
url: "https://github.com/ichbinder/MCP2ZigBee2MQTT"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ports:
  3235/tcp: 3235
ports_description:
  3235/tcp: MCP Streamable HTTP interface
map:
  - ssl:ro
options:
  mqtt_broker_url: "mqtt://core-mosquitto:1883"
  mqtt_username: ""
  mqtt_password: ""
  mqtt_base_topic: "zigbee2mqtt"
  transport_mode: "http"
  api_key: ""
  allowed_origins: ""
  ssl: false
  certfile: "fullchain.pem"
  keyfile: "privkey.pem"
  max_sessions: 32
  allow_destructive: false
  log_level: "info"
schema:
  mqtt_broker_url: url
  mqtt_username: str?
  mqtt_password: password?
  mqtt_base_topic: str
  transport_mode: "list(http|stdio)"
  api_key: password?
  allowed_origins: str?
  ssl: bool
  certfile: str
  keyfile: str
  max_sessions: int(1,128)
  allow_destructive: bool
  log_level: "list(debug|info|warn|error)"
