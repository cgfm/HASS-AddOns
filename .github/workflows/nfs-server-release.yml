name: Release NFS server images

"on":
  push:
    tags:
      - "nfs-server-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes apparmor-utils jq shellcheck yamllint
      - name: Verify release version
        run: test "${GITHUB_REF_NAME#nfs-server-v}" = "$(awk -F '"' '/^version:/{print $2}' NFS-Ganesha-App/nfs_server/config.yaml)"
      - name: Validate release sources
        run: |
          yamllint --config-file NFS-Ganesha-App/.yamllint.yaml NFS-Ganesha-App .github/workflows/nfs-server-ci.yml .github/workflows/nfs-server-release.yml
          shellcheck NFS-Ganesha-App/nfs_server/run.sh NFS-Ganesha-App/nfs_server/lib/config.sh NFS-Ganesha-App/tests/*.sh
          apparmor_parser --skip-kernel-load --skip-cache NFS-Ganesha-App/nfs_server/apparmor.txt
          bash NFS-Ganesha-App/tests/run.sh
          bash NFS-Ganesha-App/tests/security.sh
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ghcr.io/cgfm/nfs-ganesha-app
          tags: |
            type=match,pattern=nfs-server-v(.*),group=1
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: NFS-Ganesha-App/nfs_server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nfs-server-release
          cache-to: type=gha,mode=max,scope=nfs-server-release
          provenance: mode=max
          sbom: true
