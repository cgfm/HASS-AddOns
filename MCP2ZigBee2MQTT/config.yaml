name: "MCP2ZigBee2MQTT"
version: "1.0.0"
slug: "mcp2zigbee2mqtt"
description: "MCP Server that connects AI assistants to ZigBee2MQTT via MQTT for device discovery and control"
url: "https://github.com/ichbinder/MCP2ZigBee2MQTT"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 3235
panel_icon: mdi:zigbee
panel_title: "MCP2ZigBee2MQTT"
host_network: true
ports:
  3235/tcp: 3235
ports_description:
  3235/tcp: MCP HTTP/SSE interface
options:
  mqtt_broker_url: "mqtt://core-mosquitto:1883"
  mqtt_username: ""
  mqtt_password: ""
  mqtt_base_topic: "zigbee2mqtt"
  transport_mode: "http"
  api_key: ""
  log_level: "info"
schema:
  mqtt_broker_url: url
  mqtt_username: str?
  mqtt_password: password?
  mqtt_base_topic: str
  transport_mode: "list(http|stdio)"
  api_key: password?
  log_level: "list(debug|info|warn|error)"
