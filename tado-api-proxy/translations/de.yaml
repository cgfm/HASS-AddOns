configuration:
  superuser_email:
    name: Admin E-Mail
    description: >-
      E-Mail-Adresse für das Proxy-Admin-Konto (Web-UI-Login).
      Dies ist NICHT dein tado-Konto – tado-Konten werden über die Web-Oberfläche hinzugefügt.
  superuser_password:
    name: Admin Passwort
    description: >-
      Passwort für das Proxy-Admin-Konto (Web-UI-Login).
      Wähle ein sicheres Passwort – es schützt den Zugang zu deiner Proxy-Konfiguration.
  expose_to_lan:
    name: Im LAN verfügbar machen
    description: >-
      Macht den Proxy im lokalen Netzwerk erreichbar.
      Wenn aktiviert, setze auch das Port-Mapping (Standard 8080) in der Add-on-Netzwerkkonfiguration.
      Wenn deaktiviert, ist der Proxy nur über die Home Assistant Seitenleiste (Ingress) erreichbar.
network:
  8080/tcp: Tado API Proxy Port (nur bei aktiviertem LAN-Zugriff verwendet)
